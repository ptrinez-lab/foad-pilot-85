/* ============ MATRICE DES PROFILS (Paramètres) ============ */
const PAGE_KEYS=['tableau','registre','projets','publications','demandes','simulateur','assistant','composants','gouvernance','catalogue','idee','bilan','journal','parametres'];
function ProfilsMatrix({p,setP,ro}){
 const conf=id=>({...DEFAULT_PROFILS[id],...((p.profils||{})[id]||{})});
 const upd=(id,patch)=>setP({...p,profils:{...(p.profils||{}),[id]:{...conf(id),...patch}}});
 const tog=(id,key,v)=>{const c=conf(id);const arr=c[key]||[];upd(id,{[key]:arr.includes(v)?arr.filter(x=>x!==v):arr.concat([v])})};
 const cell=(id,key,v)=>html`<td><input type="checkbox" aria-label=${v} checked=${(conf(id)[key]||[]).includes(v)} disabled=${ro} onChange=${()=>tog(id,key,v)}/></td>`;
 return html`<div className="card" style=${{gridColumn:'1/-1'}}><h2>Profils et accès</h2>
  <p className="small muted">Cochez ce que chaque profil voit. La page « Proposer une idée » reste accessible à tous par lien direct. Le profil « Pilote FOAD » voit toujours tout. Enregistrez avec le bouton en haut de page.</p>
  <div className="tbl-wrap mx"><table><thead><tr><th>Élément</th>${PROFILS.map(x=>html`<th key=${x.id}>${x.l}</th>`)}</tr></thead><tbody>
   <tr><td>Proposé à l'ouverture</td>${PROFILS.map(x=>html`<td key=${x.id}><input type="checkbox" aria-label="Actif" checked=${conf(x.id).actif!==false} disabled=${ro} onChange=${()=>upd(x.id,{actif:conf(x.id).actif===false})}/></td>`)}</tr>
   <tr className="sec"><td colSpan=${PROFILS.length+1}>Pages visibles</td></tr>
   ${PAGE_KEYS.map(k=>html`<tr key=${k}><td>${NAV[k][0]}</td>${PROFILS.map(x=>html`<${React.Fragment} key=${x.id}>${cell(x.id,'pages',k)}<//>`)}</tr>`)}
   <tr><td>Page d'arrivée</td>${PROFILS.map(x=>{const c=conf(x.id);return html`<td key=${x.id}><select aria-label="Page d'arrivée" value=${c.home} disabled=${ro} onChange=${e=>upd(x.id,{home:e.target.value})}>${(c.pages||[]).map(k=>html`<option key=${k} value=${k}>${NAV[k][0]}</option>`)}</select></td>`})}</tr>
   <tr><td>Registre</td>${PROFILS.map(x=>html`<td key=${x.id}><select aria-label="Version du registre" value=${conf(x.id).registre||'allege'} disabled=${ro} onChange=${e=>upd(x.id,{registre:e.target.value})}><option value="allege">Allégé</option><option value="complet">Complet</option></select></td>`)}</tr>
   <tr><td>Tableau de bord</td>${PROFILS.map(x=>html`<td key=${x.id}><select aria-label="Version du tableau de bord" value=${conf(x.id).dash} disabled=${ro} onChange=${e=>upd(x.id,{dash:e.target.value})}><option value="direction">Synthèse</option><option value="pilote">Détaillé</option></select></td>`)}</tr>
   <tr className="sec"><td colSpan=${PROFILS.length+1}>Onglets visibles dans une fiche FOAD</td></tr>
   ${FICHE_TABS.map(([k,l])=>html`<tr key=${k}><td>${l}</td>${PROFILS.map(x=>html`<${React.Fragment} key=${x.id}>${cell(x.id,'tabs',k)}<//>`)}</tr>`)}
  </tbody></table></div></div>`;
}

/* ============ APPLICATION ============ */
const NAV={tableau:['Tableau de bord','dash','Pilotage'],registre:['Registre des FOAD','reg','Pilotage'],projets:['Projets (Kanban)','kan','Pilotage'],demandes:['Demandes','dem','Pilotage'],
 simulateur:['Simulateur de charge','sim','Conception'],assistant:['Aide au choix du format','sim','Conception'],composants:['Composants','cmp','Conception'],
 gouvernance:['Gouvernance','gov','Référentiels'],publications:['Publications ENASIS','pub','Diffusion'],catalogue:['Catalogue des FOAD','cat','Diffusion'],idee:['Proposer une idée','dem','Diffusion'],bilan:['Bilan hiérarchique','rep','Diffusion'],journal:['Journal','log','Administration'],parametres:['Paramètres','set','Administration'],lexique:['Lexique','book','Aide']};
const ROUTES=Object.keys(NAV).concat(['fiche']);

function App(){
 const [S,api]=useStore();
 const params=useMemo(()=>merge(DEFAULT_PARAMS,S.params||{}),[S.params]);
 const [profil,setProfil]=useState(()=>{let q=null;try{q=new URLSearchParams(location.search).get('profil')}catch(e){}
  const ok=id=>id&&(id==='pilote'||PROFILS.some(p=>p.id===id));if(ok(q)){lsSet('fp.profil',q);return q}const st=lsGet('fp.profil',null);return ok(st)?st:null});
 const [picker,setPicker]=useState(false);
 const [route,setRoute]=useState(()=>{const h=location.hash.slice(1);return ROUTES.includes(h)?h:null});
 const [fiche,setFiche]=useState(null);const [ficheTab,setFicheTab]=useState(null);const [back,setBack]=useState(null);
 const [selComps,setSelComps]=useState([]);
 const [msg,setMsg]=useState(null);
 const tRef=useRef();
 const toast=m=>{setMsg(m);clearTimeout(tRef.current);tRef.current=setTimeout(()=>setMsg(null),4200)};
 useEffect(()=>{const f=()=>{const h=location.hash.slice(1);if(ROUTES.includes(h)&&h!=='fiche')setRoute(h)};window.addEventListener('hashchange',f);return ()=>window.removeEventListener('hashchange',f)},[]);
 const offered=PROFILS.filter(p=>profConf(params,p.id).actif!==false).concat(S.canWrite?[PILOTE]:[]);
 const eff=profil==='pilote'?(S.canWrite||!S.authReady?'pilote':null):(profil&&PROFILS.some(p=>p.id===profil)?profil:null);
 const meta=eff==='pilote'?PILOTE:PROFILS.find(p=>p.id===eff);
 const conf=eff==='pilote'?{pages:PAGE_KEYS,home:'tableau',dash:'pilote',tabs:ALL_TABS}:eff?profConf(params,eff):{pages:['catalogue'],home:'catalogue',dash:'direction',tabs:['ident','public']};
 const allowed=PAGE_KEYS.filter(k=>(conf.pages||[]).includes(k)).concat(['lexique']);
 const home=allowed.includes(conf.home)?conf.home:(allowed[0]||'catalogue');
 const cur=route==='fiche'&&fiche?'fiche':(route&&(allowed.includes(route)||route==='idee')?route:home);
 const go=r=>{setPicker(false);if(r==='fiche-new'){setBack(cur);setFiche('new');setFicheTab(null);setRoute('fiche');window.scrollTo(0,0);return}setRoute(r);try{location.hash=r}catch(e){}window.scrollTo(0,0)};
 const openFiche=(id,tab)=>{if(cur!=='fiche')setBack(cur);setFiche(id);setFicheTab(typeof tab==='string'?tab:null);setRoute('fiche');window.scrollTo(0,0)};
 const pick=id=>{setProfil(id);lsSet('fp.profil',id);setPicker(false);setFiche(null);setRoute(r=>r==='idee'?r:null);try{if(location.hash&&location.hash!=='#idee')history.replaceState(null,'',location.pathname+location.search)}catch(e){}window.scrollTo(0,0)};
 const ro=!S.canWrite;
 const isPilot=eff==='pilote';
 const demCount=S.data.demandes.filter(d=>['Déposée','En instruction'].includes(d.statut)).length;
 const vue=isPilot||S.canWrite?'pilote':'demandeur';
 const props={S,params,api,toast,go,openFiche,vue,ro};
 let body;
 if(cur==='fiche')body=html`<${Fiche} key=${fiche+(ficheTab||'')} ...${props} id=${fiche} tabsAllowed=${conf.tabs} initialTab=${ficheTab} close=${()=>go(back&&back!=='fiche'?back:home)} openFiche=${id=>{setFiche(id)}}/>`;
 else if(cur==='tableau')body=html`<${Dashboard} ...${props} vue=${conf.dash==='pilote'?'pilote':'direction'}/>`;
 else if(cur==='registre')body=isPilot||conf.registre==='complet'?html`<${Registre} ...${props}/>`:html`<${RegistreLight} ...${props}/>`;
 else if(cur==='projets')body=html`<${Kanban} ...${props}/>`;
 else if(cur==='publications')body=html`<${Publications} ...${props}/>`;
 else if(cur==='demandes')body=html`<${Demandes} key="dem" ...${props}/>`;
 else if(cur==='idee')body=html`<${Demandes} key="idee" ...${props} idea=${true}/>`;
 else if(cur==='simulateur')body=html`<${Simulateur} ...${props} selComps=${selComps} setSelComps=${setSelComps}/>`;
 else if(cur==='assistant')body=html`<${Assistant}/>`;
 else if(cur==='composants')body=html`<${Composants} ...${props} selComps=${selComps} setSelComps=${setSelComps}/>`;
 else if(cur==='gouvernance')body=html`<${Gouvernance} ...${props}/>`;
 else if(cur==='catalogue')body=html`<${Catalogue} ...${props} vue=${allowed.includes('demandes')?'agent':'visiteur'} canPropose=${allowed.includes('idee')||allowed.includes('demandes')}/>`;
 else if(cur==='bilan')body=html`<${Bilan} ...${props}/>`;
 else if(cur==='journal')body=html`<${JournalPage} ...${props}/>`;
 else if(cur==='parametres')body=html`<${Parametres} ...${props}/>`;
 else if(cur==='lexique')body=html`<${Lexique}/>`;
 const groups=[];allowed.forEach(k=>{const g=NAV[k][2];let G=groups.find(x=>x.g===g);if(!G)groups.push(G={g,items:[]});G.items.push(k)});
 const single=false;
 const modeTxt=S.mode==='db'?(S.stale?'Mise à jour en direct interrompue : rechargez la page':'Base en ligne, mise à jour en direct'):S.mode==='error'?'Base injoignable ('+S.dbError+')':'Connexion à la base…';
 const modeCol=S.mode==='db'&&!S.stale&&!S.dbError?'var(--ok)':S.mode==='loading'?'var(--faint)':'var(--warn)';
 const showPicker=picker||!eff;
 return html`<div className="app">
  <aside className="side">
   <div className="brand"><b>FOAD <em>PILOT</em> 85</b><span>SDIS de la Vendée</span></div>
   ${meta?html`<div className="prof-chip"><${Ico} n=${meta.i}/><span className="grow small">${meta.l}</span></div>`:null}
   ${single?null:html`<nav className="nav" aria-label="Navigation principale">${groups.map(G=>html`<${React.Fragment} key=${G.g}><div className="grp">${G.g}</div>${G.items.map(k=>html`<button key=${k} className=${cur===k||(cur==='fiche'&&k===back)?'on':''} onClick=${()=>go(k)}><${Ico} n=${NAV[k][1]}/>${NAV[k][0]}${k==='demandes'&&demCount&&S.canWrite?html`<span className="count">${demCount}</span>`:null}</button>`)}<//>`)}</nav>`}
   <div className="side-foot">
    <button className="btn sm" onClick=${()=>setPicker(true)}>Changer de profil</button>
    <div className="mode"><span className="dot" style=${{background:modeCol}}></span><span>${modeTxt}</span></div>
    ${S.me||isPilot?html`<${Login} S=${S} api=${api} toast=${toast}/>`:null}
   </div>
  </aside>
  <main>${body}</main>
  ${showPicker?html`<${ProfilePicker} profiles=${offered} current=${eff} onPick=${pick} onClose=${eff?()=>setPicker(false):null} S=${S} api=${api} toast=${toast}/>`:null}
  ${msg?html`<div className="toast" role="status">${msg}</div>`:null}
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>

</body>
</html>
