<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FOAD PILOT 85</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout : navigation latérale bleu nuit + espace de travail en cartes légères ; pile verticale sous 900px */
:root{
  --nav:#12203a; --nav-2:#1b2c4d; --nav-fg:#c3cde0; --nav-on:#ffffff;
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --line:#dce1ea; --line-2:#c7cfdc;
  --fg:#18202f; --muted:#5b6578; --faint:#8790a1;
  --red:#c0142f; --red-soft:#fbe9ec;
  --ok:#1d7f47; --ok-soft:#e5f4ea; --warn:#b4620a; --warn-soft:#fdf1e1;
  --bad:#c62828; --bad-soft:#fdeaea; --info:#1f5ea8; --info-soft:#e7effa;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --nav:#0a111d; --nav-2:#15223a; --nav-fg:#a9b5ca; --nav-on:#ffffff;
  --bg:#0e1522; --surface:#151e2e; --surface-2:#1a2436; --line:#27334a; --line-2:#36445f;
  --fg:#e6eaf1; --muted:#9aa5b8; --faint:#6f7a8f;
  --red:#e9495f; --red-soft:#3a1c24;
  --ok:#47bd7c; --ok-soft:#163324; --warn:#f0a443; --warn-soft:#3a2a14;
  --bad:#f06060; --bad-soft:#3b1c1e; --info:#6ea6ec; --info-soft:#17283f; color-scheme:dark}}
:root[data-theme="dark"]{
  --nav:#0a111d; --nav-2:#15223a; --nav-fg:#a9b5ca; --nav-on:#ffffff;
  --bg:#0e1522; --surface:#151e2e; --surface-2:#1a2436; --line:#27334a; --line-2:#36445f;
  --fg:#e6eaf1; --muted:#9aa5b8; --faint:#6f7a8f;
  --red:#e9495f; --red-soft:#3a1c24;
  --ok:#47bd7c; --ok-soft:#163324; --warn:#f0a443; --warn-soft:#3a2a14;
  --bad:#f06060; --bad-soft:#3b1c1e; --info:#6ea6ec; --info-soft:#17283f; color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
#root{min-height:100%}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--nav);color:var(--nav-fg);display:flex;flex-direction:column;gap:18px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;color:var(--nav-on)}
.brand b em{font-style:normal;color:var(--red)}
.brand span{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:12px 8px 4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;color:var(--nav-fg);font-weight:500}
.nav button:hover{background:var(--nav-2);color:var(--nav-on)}
.nav button.on{background:var(--nav-2);color:var(--nav-on);box-shadow:inset 3px 0 0 var(--red)}
.nav button:focus-visible{outline:2px solid var(--nav-on);outline-offset:1px}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:0 6px}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px}
.side-foot select{width:100%;background:var(--nav-2);color:var(--nav-on);border:1px solid var(--nav-2);border-radius:6px;padding:7px}
.side-foot small{color:var(--faint);line-height:1.35}
.mode{display:flex;gap:6px;align-items:flex-start;padding:8px;border-radius:6px;background:var(--nav-2);line-height:1.3}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:4px}
main{min-width:0;padding-block:22px 60px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0;letter-spacing:-.005em;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2,.card h3{font-family:var(--f-display);margin:0 0 10px;font-weight:700}
.card h2{font-size:16px}.card h3{font-size:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit}
button.kpi{cursor:pointer}button.kpi:hover{border-color:var(--line-2)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi.t-ok{border-top:3px solid var(--ok)}.kpi.t-warn{border-top:3px solid var(--warn)}.kpi.t-bad{border-top:3px solid var(--bad)}.kpi.t-info{border-top:3px solid var(--info)}.kpi.t-n{border-top:3px solid var(--line-2)}.kpi.t-red{border-top:3px solid var(--red)}
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{filter:brightness(1.06)}
.btn.q{border-color:transparent;background:transparent;color:var(--info)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--info);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:68px;resize:vertical}
input[type=checkbox]{width:auto}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.badge.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}.small{font-size:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
th.sort{cursor:pointer}th.sort:hover{color:var(--fg)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:grid;grid-template-columns:2fr repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--red)}
.tabs button:focus-visible{outline:2px solid var(--info)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.flabel{display:flex;justify-content:space-between;align-items:center;gap:8px}
.flabel label{font-size:12px;font-weight:600;color:var(--muted)}
.req{color:var(--red);margin-left:2px}
.conf{font-size:10.5px;font-weight:600;border-radius:9px;padding:1px 6px;border:1px solid transparent;width:auto;min-width:0}
select.conf{padding:1px 4px;cursor:pointer}
.c-connu{background:var(--ok-soft);color:var(--ok)}.c-suppose{background:var(--info-soft);color:var(--info)}.c-a_confirmer{background:var(--warn-soft);color:var(--warn)}
.c-none{background:transparent;color:var(--faint);border:1px dashed var(--line-2)}
.field.empty input,.field.empty textarea,.field.empty select:not(.conf){border-style:dashed}
.hint{font-size:11.5px;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:14px;padding:3px 10px;cursor:pointer}
.chip.on{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;gap:8px;align-items:center;font-size:12.5px}
.bar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bar-t{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:5px}
.bar-v{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--line-2)}
.alert.bad{border-color:var(--bad);background:var(--bad-soft)}.alert.warn{border-color:var(--warn);background:var(--warn-soft)}.alert.info{border-color:var(--info);background:var(--info-soft)}
.alert b{font-weight:600}
.list{display:flex;flex-direction:column;gap:8px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.over{border-color:var(--info);background:var(--info-soft)}
.col h4{margin:2px 4px;font-family:var(--f-display);font-size:13px;display:flex;justify-content:space-between}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.kcard.p-Haute{border-left:3px solid var(--red)}.kcard.p-Moyenne{border-left:3px solid var(--warn)}.kcard.p-Basse{border-left:3px solid var(--line-2)}
.kcard b{font-size:13px;line-height:1.3}
.prog{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--info)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:6px;max-width:420px;z-index:50;font-size:13px}
.empty-state{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}
.sim-out td,.sim-out th{padding:6px 8px}
.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.scale button{font:inherit;text-align:left;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--fg);padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.scale button.on{border-color:var(--info);box-shadow:inset 0 0 0 1px var(--info)}
.scale .lv{font-weight:700;display:flex;gap:6px;align-items:center}
.sw{width:10px;height:10px;border-radius:50%}
.range3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.range3 div{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface-2)}
.range3 .c{background:var(--info-soft);border-color:var(--info)}
.range3 b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;display:block}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cat-card{display:flex;flex-direction:column;gap:8px}
.cat-card .pic{width:40px;height:40px;border-radius:8px;background:var(--nav);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:13px}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;counter-reset:s}
.steps div{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface);font-size:12.5px}
.steps div::before{counter-increment:s;content:counter(s);display:block;font-family:var(--f-mono);color:var(--red);font-weight:600}
.circuit{display:flex;flex-direction:column;gap:6px}
.circuit .st{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px}
.report{max-width:900px}
.report h2{font-family:var(--f-display);font-size:17px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--red)}
.report p,.report li{max-width:75ch}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.backbtn{all:unset;cursor:pointer;color:var(--info);font-weight:600;font-size:13px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.compl{display:flex;align-items:center;gap:8px}.compl .prog{width:90px}
.check{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line)}
.check span small{display:block;color:var(--faint)}
.tip{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--info);font-size:11px;font-weight:700;font-family:var(--f-body);cursor:help;margin-left:5px;vertical-align:middle;flex:none;line-height:1;text-transform:none;letter-spacing:0}
.tip:hover,.tip:focus-visible{border-color:var(--info);background:var(--info-soft);outline:none}
.bub{position:fixed;z-index:80;width:290px;max-width:calc(100vw - 16px);background:var(--fg);color:var(--bg);font-weight:400;font-size:12.5px;line-height:1.45;padding:9px 11px;border-radius:6px;text-align:left;pointer-events:none;white-space:normal;text-transform:none;letter-spacing:0}
.bub b{display:block;margin-bottom:2px}
.lx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.lx{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.lx b{font-family:var(--f-display);font-size:14.5px}
.lx p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.chain{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.chain div{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);font-size:13px}
.chain div b{display:block;font-family:var(--f-display);font-size:14px;margin-bottom:3px}
.chain div span.n{font-family:var(--f-mono);color:var(--red);font-size:12px}
.sim-grp{grid-column:1/-1;font-family:var(--f-display);font-weight:700;font-size:13px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio label{font-size:11.5px;color:var(--muted)}
@media (max-width:700px){.chain{grid-template-columns:1fr 1fr}}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,17,29,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:calc(24px + env(safe-area-inset-top,0px)) 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:920px;padding:24px;display:flex;flex-direction:column;gap:16px}
.dialog h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
.dialog p{margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pcard{font:inherit;color:var(--fg);text-align:left;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface)}
.pcard:hover{border-color:var(--info);background:var(--info-soft)}
.pcard:focus-visible{outline:2px solid var(--info);outline-offset:1px}
.pcard.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.pcard .pi{width:38px;height:38px;border-radius:8px;background:var(--nav);color:#fff;display:grid;place-items:center;flex:none}
.pcard.pilot .pi{background:var(--red)}
.pcard .pi .ico{width:19px;height:19px}
.pcard b{display:block;font-size:14px;line-height:1.3}
.pcard .d{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.dfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.prof-chip{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;background:var(--nav-2);color:var(--nav-on);line-height:1.25}
.prof-chip .ico{flex:none}
.mx th,.mx td{text-align:center;padding:6px 8px}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px}
.mx th{white-space:normal;min-width:92px;line-height:1.25;vertical-align:bottom}
.mx tr.sec td{background:var(--surface-2);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mx select{font-size:11.5px;padding:3px 4px}
@media (max-width:1100px){.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filters>:first-child{grid-column:1/-1}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav .grp{display:none}.nav button{white-space:nowrap}
  .side-foot{flex-direction:row;flex-wrap:wrap;align-items:center}.side-foot select{width:auto}.side-foot small{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2,.g3,.form{grid-template-columns:1fr}.scale{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){.filters{grid-template-columns:1fr 1fr}.range3{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>

function useStore(){
 const blank={foad:[],demandes:[],validations:[],regles:[],composants:[],journal:[]};
 const [st,setSt]=useState({mode:'loading',data:blank,params:null,me:null,canWrite:false,authReady:false,stale:false,dbError:null,canDownload:true});
 const R=useRef({me:null,editor:false});
 useEffect(()=>{
  let alive=true;
  const load=async()=>{let all=[],from=0;for(;;){const {data,error}=await sb.from('records').select('col,id,data').range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}return all};
  load().then(rows=>{if(!alive)return;const data={...blank};let params=null;
    rows.forEach(r=>{if(r.col==='config'){if(r.id==='params')params=r.data}else data[r.col]=(data[r.col]||[]).concat([{...r.data,id:r.id}])});
    setSt(s=>({...s,mode:'db',data,params}))}).catch(e=>setSt(s=>({...s,mode:'error',dbError:e.message||'connexion impossible'})));
  const ch=sb.channel('records-live').on('postgres_changes',{event:'*',schema:'public',table:'records'},p=>{
    setSt(s=>{const row=p.eventType==='DELETE'?p.old:p.new;if(!row||!row.col)return s;const col=row.col,id=row.id;
     if(col==='config')return id==='params'?{...s,params:p.eventType==='DELETE'?null:row.data}:s;
     const arr=(s.data[col]||[]).filter(r=>r.id!==id);if(p.eventType!=='DELETE')arr.push({...row.data,id});
     return {...s,data:{...s.data,[col]:arr}}})
   }).subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')setSt(s=>({...s,stale:true}));if(status==='SUBSCRIBED')setSt(s=>({...s,stale:false}))});
  const onAuth=async session=>{const email=(session&&session.user&&session.user.email)||null;let ed=false;
   if(email){try{const {data}=await sb.rpc('is_editor');ed=!!data}catch(e){}}
   R.current.me=email;R.current.editor=ed;if(alive)setSt(s=>({...s,me:email,canWrite:ed,authReady:true}))};
  sb.auth.getSession().then(({data})=>onAuth(data.session));
  const {data:sub}=sb.auth.onAuthStateChange((_e,session)=>{setTimeout(()=>onAuth(session),0)});
  return ()=>{alive=false;sb.removeChannel(ch);sub.subscription.unsubscribe()};
 },[]);
 const api=useMemo(()=>{
  const fail=error=>{throw {code:error.code,message:error.message}};
  const save=async(col,id,body)=>{
   const b=clone(body);delete b.id;
   if(col!=='journal'&&col!=='validations'){b.updatedAt=nowIso();b.updatedBy=R.current.me}
   const appendOnly=col==='journal'||col==='validations'||!R.current.editor;
   const q=appendOnly?sb.from('records').insert({col,id,data:b}):sb.from('records').upsert({col,id,data:b},{onConflict:'col,id'});
   const {error}=await q;if(error)fail(error);
   setSt(s=>({...s,data:{...s.data,[col]:s.data[col].filter(r=>r.id!==id).concat([{...b,id}])}}));
  };
  const remove=async(col,id)=>{const {error}=await sb.from('records').delete().eq('col',col).eq('id',id);if(error)fail(error);
   setSt(s=>({...s,data:{...s.data,[col]:s.data[col].filter(r=>r.id!==id)}}))};
  const log=async(foad,type,texte)=>{try{await save('journal',uid('J'),{at:nowIso(),by:R.current.me,foad:foad||null,type,texte})}catch(e){}};

  const download=async(filename,data)=>{const blob=new Blob([data],{type:filename.endsWith('.json')?'application/json':filename.endsWith('.csv')?'text/csv':'text/html'});
   const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return {status:'saved'}};
  const names=async()=>({});

  const logout=async()=>{await sb.auth.signOut()};
  return {save,remove,log,saveParams,download,names,login,logout};
 },[]);
 return [st,api];

const KEY_FIELDS=[['titre','Intitulé'],['domaine','Domaine'],['type','Type'],['objectifs','Objectifs'],['publics','Public'],['caractere','Caractère'],['dureeTheo','Durée théorique'],['respPeda','Responsable pédagogique'],['expert','Expert métier'],['concepteur','Concepteur'],['version','Version'],['evaluation','Modalités d\'évaluation'],['achevement','Conditions d\'achèvement']];
function completeness(f){
 const keys=KEY_FIELDS.slice();
 if(f.statutPublication==='Publiée'){keys.push(['datePublication','Date de publication'],['lienEnasis','Lien ENASIS'],['prochaineRevision','Prochaine révision'],['autoriteDiffusion','Autorité de diffusion'])}
 const miss=keys.filter(([k])=>isEmpty(f[k]));
 const toConfirm=Object.entries(f.conf||{}).filter(([k,v])=>v==='a_confirmer'&&!isEmpty(f[k])).length;
 return {pct:Math.round((keys.length-miss.length)/keys.length*100),miss,toConfirm};
}
function alertsFor(f,vals,params){
 const a=[];const s=params.seuilAlerte||30;
 if(['Archivage','Abandonné'].includes(f.etape))return a;
 const dc=daysTo(f.dateCible);
 if(dc!=null&&dc<0&&!TERMINAUX.includes(f.etape))a.push({l:'bad',t:'Date cible dépassée de '+(-dc)+' j'});
 else if(dc!=null&&dc<=s&&!TERMINAUX.includes(f.etape))a.push({l:'warn',t:'Date cible dans '+dc+' j'});
 if(!isEmpty(f.blocages))a.push({l:'bad',t:'Point bloquant : '+f.blocages});
 const dr=daysTo(f.prochaineRevision);
 if(dr!=null&&dr<0)a.push({l:'bad',t:'Révision dépassée ('+fmtD(f.prochaineRevision)+')'});
 else if(dr!=null&&dr<=s)a.push({l:'warn',t:'Révision à prévoir le '+fmtD(f.prochaineRevision)});
 if(f.revisionNecessaire)a.push({l:'warn',t:'Révision identifiée'+(f.typeRevision?' : '+f.typeRevision:'')});
 if(f.statutPublication==='Publiée'&&!diffusionOk(f))a.push({l:'bad',t:'Publiée sans autorisation de diffusion tracée'});
 if(f.etape==='Exploitation'&&f.statutPublication!=='Publiée')a.push({l:'warn',t:'En exploitation mais statut de publication ≠ « Publiée »'});
 if(f.statutPublication==='Publiée'&&isEmpty(f.prochaineRevision))a.push({l:'warn',t:'Publiée sans date de prochaine révision'});
 if(!['Non publiée',''].includes(f.statutPublication||'')&&isEmpty(f.autoriteDiffusion)&&!['À qualifier','Idée'].includes(f.etape))a.push({l:'warn',t:'Autorité de diffusion non désignée pour cette FOAD'});
 Object.entries(f.valid||{}).forEach(([k,v])=>{if(v==='Refusé'||v==='À reprendre')a.push({l:'bad',t:k+' : '+v.toLowerCase()})});
 const vv=f.validVersion||{};
 Object.entries(vv).forEach(([k,v])=>{if(v&&f.version&&v!==f.version&&['Accordé','Accordé avec réserves'].includes((f.valid||{})[k]))a.push({l:'warn',t:k+' portait sur la version '+v+', version actuelle '+f.version})});
 return a;
}

const COMPLEX=[

 {k:'intermediaire',lv:'Intermédiaire',c:'#d4a106',d:'Plusieurs blocs interactifs, des cas concrets, une mise en forme travaillée.'},

 {k:'expert',lv:'Expert',c:'var(--bad)',d:'Simulations, nombreux embranchements, plusieurs validations métier.'}];
const PHASES=[['cadrage','Cadrage'],['scenarisation','Scénarisation'],['redaction','Rédaction et questions'],['rise','Mise en forme dans Rise'],['dev','Développements sur mesure'],['graph','Création graphique'],['av','Vidéo et audio'],['integration','Intégration'],['tests','Tests'],['corrections','Relectures et corrections'],['publication','Publication sur ENASIS'],['documentation','Documentation'],['maintenance','Maintenance initiale']];
const FIXED_PHASES=['cadrage','integration','publication','documentation','maintenance'];
const SIM_DEFAULT={duree:45,sequences:4,complexite:'intermediaire',qualite:'partielles',modele:true,interactions:8,questions:10,visuels:2,videoCreer:0,videoRetravailler:0,videoPrete:0,audio:0,htmlCreer:0,htmlAdapter:0,htmlReutil:0,slCreer:0,slAdapter:0,relecteurs:2,cycles:2};
function simulate(inp,p,comps){
 const C=p.sim,U=C.u;const n=k=>Math.max(0,+inp[k]||0);
 const lines={},why={};const add=(k,v,t)=>{if(!v)return;lines[k]=(lines[k]||0)+v;(why[k]=why[k]||[]).push(t)};
 const D=n('duree')/60;const Deq=D>0?Math.pow(D,C.degressivite):0;
 const ratio=C.ratios[inp.complexite]||0;const prod=ratio*Deq;
 const q=C.qualite[inp.qualite]||1;const mod=inp.modele?C.modele:1;
 Object.entries(C.fixes).forEach(([k,v])=>add(k,+v,'Temps fixe par projet : '+fmtH(+v)));
 const R=C.repartition;
 add('scenarisation',prod*R.scenarisation/100*q,`${R.scenarisation} % du temps de base${q!==1?' × ressources '+q:''}`);
 add('redaction',prod*R.redaction/100*q,`${R.redaction} % du temps de base${q!==1?' × ressources '+q:''}`);
 add('rise',prod*R.rise/100*mod,`${R.rise} % du temps de base${mod!==1?' × modèle existant '+mod:''}`);
 add('scenarisation',n('sequences')*U.sequence,`${n('sequences')} séquence(s) × ${fmtH(U.sequence)}`);
 add('redaction',n('questions')*U.question,`${n('questions')} question(s) × ${fmtH(U.question)}`);
 add('rise',n('interactions')*U.interaction,`${n('interactions')} bloc(s) interactif(s) × ${fmtH(U.interaction)}`);
 add('graph',n('visuels')*U.visuel,`${n('visuels')} visuel(s) × ${fmtH(U.visuel)}`);
 add('av',n('videoCreer')*U.videoCreer,`${n('videoCreer')} vidéo(s) à créer × ${fmtH(U.videoCreer)}`);
 add('av',n('videoRetravailler')*U.videoRetravailler,`${n('videoRetravailler')} vidéo(s) à retravailler × ${fmtH(U.videoRetravailler)}`);
 add('av',n('videoPrete')*U.videoPrete,`${n('videoPrete')} vidéo(s) prête(s) × ${fmtH(U.videoPrete)}`);
 add('av',n('audio')*U.audioMin,`${n('audio')} min d'audio × ${fmtH(U.audioMin)}`);
 add('dev',n('htmlCreer')*U.htmlCreer,`${n('htmlCreer')} composant(s) à créer × ${fmtH(U.htmlCreer)}`);
 add('dev',n('htmlAdapter')*U.htmlAdapter,`${n('htmlAdapter')} composant(s) à adapter × ${fmtH(U.htmlAdapter)}`);
 add('dev',n('htmlReutil')*U.htmlReutil,`${n('htmlReutil')} composant(s) réutilisé(s) × ${fmtH(U.htmlReutil)}`);
 add('dev',n('slCreer')*U.slCreer,`${n('slCreer')} activité(s) Storyline à créer × ${fmtH(U.slCreer)}`);
 add('dev',n('slAdapter')*U.slAdapter,`${n('slAdapter')} activité(s) Storyline à adapter × ${fmtH(U.slAdapter)}`);
 (comps||[]).forEach(c=>{const h=num(c.tempsReutil)??num(c.tempsCreation);if(h)add('dev',h,`Composant du catalogue « ${c.nom} » : ${fmtH(h)}`)});
 const nbComp=n('htmlCreer')+n('htmlAdapter')+n('htmlReutil')+n('slCreer')+n('slAdapter')+(comps||[]).length;
 add('integration',nbComp*U.integrationParComposant,`${nbComp} élément(s) sur mesure à intégrer × ${fmtH(U.integrationParComposant)}`);
 const production=['scenarisation','redaction','rise','dev','graph','av'].reduce((t,k)=>t+(lines[k]||0),0);
 add('tests',Math.max(U.testsMin,production*U.testsPct/100),`${U.testsPct} % de la production (minimum ${fmtH(U.testsMin)})`);
 add('corrections',n('relecteurs')*U.relecteur,`${n('relecteurs')} relecteur(s) × ${fmtH(U.relecteur)} pour consolider leurs remarques`);
 const cyc=Math.max(0,(+inp.cycles||1)-1);
 add('corrections',production*cyc*U.cyclePct/100,`${cyc} tour(s) de correction supplémentaire(s) × ${U.cyclePct} % de la production`);
 const central=Object.values(lines).reduce((a,b)=>a+b,0);
 return {D,Deq,ratio,prod,production,lines,why,central,bas:central*C.fourchette.bas,haut:central*C.fourchette.haut,parHeure:D?central/D:null};
}

const ALL_FIELDS=Object.values(F).flat();

function Field({def,value,conf,onChange,onConf,params,ro}){
 const empty=def.t==='bool'?false:isEmpty(value);
 const id='f_'+def.k;const dis=ro||def.ro;
 const opts=typeof def.opts==='string'?(params[def.opts]||[]):def.opts;
 let input;
 if(def.t==='ta')input=html`<textarea id=${id} value=${value||''} disabled=${dis} onChange=${e=>onChange(e.target.value)}></textarea>`;
 else if(def.t==='select')input=html`<select id=${id} value=${value||''} disabled=${dis} onChange=${e=>onChange(e.target.value)}><option value="">— non renseigné —</option>${(opts||[]).concat(value&&!(opts||[]).includes(value)?[value]:[]).map(o=>html`<option key=${o}>${o}</option>`)}</select>`;
 else if(def.t==='multi'){const arr=value||[];input=html`<div className="chips" id=${id}>${opts.map(o=>html`<button type="button" key=${o} className=${'chip'+(arr.includes(o)?' on':'')} disabled=${dis} aria-pressed=${arr.includes(o)} onClick=${()=>onChange(arr.includes(o)?arr.filter(x=>x!==o):arr.concat([o]))}>${o}</button>`)}</div>`}
 else if(def.t==='bool')input=html`<label className="row small"><input type="checkbox" id=${id} checked=${!!value} disabled=${dis} onChange=${e=>onChange(e.target.checked)}/> Oui</label>`;
 else input=html`<input id=${id} type=${def.t==='number'?'number':def.t==='date'?'date':'text'} value=${value??''} disabled=${dis} onChange=${e=>onChange(def.t==='number'?(e.target.value===''?'':+e.target.value):e.target.value)}/>`;
 return html`<div className=${'field'+(def.wide?' wide':'')+(empty?' empty':'')}>
  <div className="flabel"><span><label htmlFor=${id}>${def.l}${def.req?html`<b className="req" title="Information clé">*</b>`:null}</label><${Tip} k=${def.tip||def.k}/></span>
   ${def.noConf?null:empty?html`<span className="conf c-none">Non renseigné</span>`:
    dis?html`<span className=${'conf c-'+(conf||'connu')}>${({connu:'Connu',suppose:'Supposé',a_confirmer:'À confirmer'})[conf||'connu']}</span>`:
    html`<select className=${'conf c-'+(conf||'connu')} aria-label=${'Fiabilité : '+def.l} value=${conf||'connu'} onChange=${e=>onConf(e.target.value)}><option value="connu">Connu</option><option value="suppose">Supposé</option><option value="a_confirmer">À confirmer</option></select>`}
  </div>${input}${def.hint?html`<div className="hint">${def.hint}</div>`:null}</div>`;
}
function FieldGrid({defs,obj,set,setConf,params,ro}){
 return html`<div className="form">${defs.map(d=>html`<${Field} key=${d.k} def=${d} value=${obj[d.k]} conf=${(obj.conf||{})[d.k]} params=${params} ro=${ro} onChange=${v=>set(d.k,v)} onConf=${v=>setConf(d.k,v)}/>`)}</div>`;
}

/* ============ COMPOSANTS D'AFFICHAGE ============ */
function Bars({rows,unit,color}){
 const m=Math.max(1,...rows.map(r=>r.v));
 if(!rows.length)return html`<div className="muted small">Aucune donnée renseignée.</div>`;
 return html`<div className="bars">${rows.map(r=>html`<div className="bar-row" key=${r.k}><span className="bar-l" title=${r.k}>${r.k}</span><span className="bar-t"><i style=${{width:(r.v/m*100)+'%',background:r.c||color||'var(--info)'}}></i></span><span className="bar-v">${unit?fmtH(r.v):r.v}</span></div>`)}</div>`;
}
function Kpi({v,l,tone,onClick}){return html`<${onClick?'button':'div'} className=${'kpi t-'+(tone||'n')} onClick=${onClick}><span className="v">${v}</span><span className="l">${l}</span><//>`}
function Head({eyebrow,title,sub,children}){return html`<div className="top"><div><div className="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub?html`<p>${sub}</p>`:null}</div><div className="row">${children}</div></div>`}

/* ============ MODULE 1 — TABLEAU DE BORD ============ */
function Dashboard({S,params,go,openFiche,vue}){
 const fo=S.data.foad,act=fo.filter(f=>!['Archivage','Abandonné'].includes(f.etape));
 const cnt=fn=>fo.filter(fn).length;
 const alerts=fo.flatMap(f=>alertsFor(f,S.data.validations,params).map(a=>({...a,f})));
 const retards=alerts.filter(a=>a.t.startsWith('Date cible dépassée')).length;
 const charge=act.reduce((s,f)=>s+(num(f.chargeRestante)||0),0);
 const chargeN=act.filter(f=>!isEmpty(f.chargeRestante)).length;
 const demNew=S.data.demandes.filter(d=>['Déposée','En instruction'].includes(d.statut)).length;
 const parDomaine=Object.entries(fo.reduce((m,f)=>{const k=f.domaine||'Non renseigné';m[k]=(m[k]||0)+1;return m},{})).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
 const parEtape=ETAPES.map(e=>({k:e,v:fo.filter(f=>f.etape===e).length})).filter(r=>r.v);
 const year=String(new Date().getFullYear());
 const pubYear=fo.filter(f=>(f.datePublication||'').startsWith(year)).length;
 const sansDate=fo.filter(f=>f.statutPublication==='Publiée'&&!f.datePublication).length;
 const parAn=Object.entries(fo.filter(f=>f.datePublication).reduce((m,f)=>{const y=f.datePublication.slice(0,4);m[y]=(m[y]||0)+1;return m},{})).sort().map(([k,v])=>({k,v}));
 const heuresForm=fo.filter(f=>f.statutPublication==='Publiée'&&!isEmpty(f.dureeTheo)).reduce((s,f)=>s+f.dureeTheo/60,0);
 const tps=fo.filter(f=>!isEmpty(f.tempsReel)||!isEmpty(f.tempsPrevu)).map(f=>({f,p:num(f.tempsPrevu),r:num(f.tempsReel)}));
 const heuresConc=tps.reduce((s,x)=>s+(x.r||0),0);
 const echeances=act.filter(f=>f.dateCible&&!TERMINAUX.includes(f.etape)).sort((a,b)=>a.dateCible.localeCompare(b.dateCible)).slice(0,6);
 const decisions=act.filter(f=>!isEmpty(f.decisionAttendue));
 const questions=S.data.regles.filter(r=>r.kind==='question'&&r.statut!=='Tranchée');
 const direction=vue==='direction';
 const K=[
  [fo.length,'FOAD et thèmes recensés','n','registre'],[cnt(f=>f.statutPublication==='Publiée'),'Publiées sur ENASIS','ok','registre'],
  [cnt(f=>diffusionOk(f)&&f.statutPublication!=='Publiée'),'Validées, non publiées','info'],[cnt(f=>f.etape==='Expérimentation'),'En expérimentation','info','projets'],
  [cnt(f=>G_CONCEPTION.includes(f.etape)),'En conception','info','projets'],[cnt(f=>G_DISCUSSION.includes(f.etape)),'En discussion','n','projets'],
  [cnt(f=>f.etape==='Validation'),'En attente de validation','warn','projets'],[cnt(f=>f.etape==='Révision'||f.revisionNecessaire||(daysTo(f.prochaineRevision)??1)<0),'Révision nécessaire','warn'],
  [cnt(f=>f.etape==='Archivage'),'Archivées','n'],[cnt(f=>f.etape==='À qualifier'),'Fiches à qualifier','warn','registre'],[demNew,'Demandes à instruire','red','demandes'],
  [chargeN?fmtH(charge):'—','Charge restante ('+chargeN+' projets chiffrés)','n'],[retards,'Retards identifiés',retards?'bad':'ok']];
 const KD=[K[1],K[2],[act.filter(f=>!G_DISCUSSION.includes(f.etape)&&!TERMINAUX.includes(f.etape)&&f.etape!=='À qualifier').length,'Projets en cours','info','projets'],K[10],[pubYear,'Publiées en '+year,'ok'],[heuresConc?fmtH(heuresConc):'—','Heures de conception tracées','n'],[heuresForm?fmtH(heuresForm):'—','Heures de formation publiées (durée théorique)','n'],K[12],[decisions.length+questions.length,'Arbitrages attendus',decisions.length+questions.length?'red':'ok']];
 return html`<div>
  <${Head} eyebrow=${direction?'Vue direction':'Vue pilote'} title="Tableau de bord" sub=${'Indicateurs calculés à partir des '+fo.length+' fiches du registre. Les champs non renseignés ne sont jamais extrapolés.'}>
   ${direction?html`<button className="btn p" onClick=${()=>go('bilan')}><${Ico} n="rep"/> Préparer le bilan</button>`:html`<button className="btn p" onClick=${()=>go('fiche-new')}><${Ico} n="plus"/> Nouvelle fiche</button>`}
  <//>
  ${fo.length===0?html`<div className="empty-state">Le registre est vide. Créez une première fiche ou importez une sauvegarde depuis <b>Paramètres</b>.</div>`:null}
  <div className="kpis">${(direction?KD:K).map((k,i)=>html`<${Kpi} key=${i} v=${k[0]} l=${k[1]} tone=${k[2]} onClick=${k[3]?()=>go(k[3]):null}/>`)}</div>
  <div className="grid g2">
   <div className="card"><h2>Alertes prioritaires</h2><div className="list">
    ${alerts.length?alerts.sort((a,b)=>(a.l==='bad'?0:1)-(b.l==='bad'?0:1)).slice(0,direction?6:12).map((a,i)=>html`<div key=${i} className=${'alert '+a.l}><div className="grow"><b>${a.f.titre}</b><div className="small">${a.t}</div></div><button className="btn sm q" onClick=${()=>openFiche(a.f.id)}>Ouvrir</button></div>`):html`<div className="muted small">Aucune alerte sur les données renseignées.</div>`}
    ${alerts.length>12&&!direction?html`<div className="small muted">+ ${alerts.length-12} autres alertes dans le registre (filtre « avec alertes »).</div>`:null}</div></div>
   <div className="card"><h2>Décisions attendues</h2><div className="list">
    ${decisions.map(f=>html`<div key=${f.id} className="alert info"><div className="grow"><b>${f.titre}</b><div className="small">${f.decisionAttendue}</div></div><button className="btn sm q" onClick=${()=>openFiche(f.id)}>Ouvrir</button></div>`)}
    ${questions.map(q=>html`<div key=${q.id} className="alert warn"><div className="grow"><b>Gouvernance : ${q.titre}</b><div className="small">${q.categorie||''} · ${q.nature||''}</div></div><button className="btn sm q" onClick=${()=>go('gouvernance')}>Voir</button></div>`)}
    ${!decisions.length&&!questions.length?html`<div className="muted small">Aucun arbitrage en attente.</div>`:null}</div></div>
   <div className="card"><h2>Répartition par domaine</h2><${Bars} rows=${parDomaine}/></div>
   <div className="card"><h2>Avancement du portefeuille</h2><${Bars} rows=${parEtape.map(r=>({...r,c:r.k==='Exploitation'?'var(--ok)':r.k==='À qualifier'?'var(--warn)':'var(--info)'}))}/></div>
   <div className="card"><h2>Publications par année</h2><${Bars} rows=${parAn} color="var(--ok)"/>${sansDate?html`<p className="small muted">${sansDate} FOAD publiée(s) sans date de publication renseignée, non comptée(s).</p>`:null}</div>
   <div className="card"><h2>Prochaines échéances</h2>${echeances.length?html`<div className="tbl-wrap"><table><tbody>${echeances.map(f=>{const d=daysTo(f.dateCible);return html`<tr key=${f.id} className="click" onClick=${()=>openFiche(f.id)}><td>${f.titre}<div className="small muted">${f.etape}</div></td><td className="num">${fmtD(f.dateCible)}<div><${Badge} tone=${d<0?'bad':d<=params.seuilAlerte?'warn':''}>${d<0?'dépassée':'J-'+d}<//></div></td></tr>`})}</tbody></table></div>`:html`<div className="muted small">Aucune date cible renseignée.</div>`}</div>
  </div>
  ${!direction?html`<div className="card" style=${{marginTop:14}}><h2>Temps de conception : prévu et réel</h2>
   ${tps.length?html`<div className="tbl-wrap"><table><thead><tr><th>FOAD</th><th className="num">Prévu</th><th className="num">Réel</th><th className="num">Écart</th></tr></thead><tbody>${tps.map(x=>html`<tr key=${x.f.id}><td>${x.f.titre}</td><td className="num">${fmtH(x.p)}</td><td className="num">${fmtH(x.r)}</td><td className="num">${x.p&&x.r?html`<${Badge} tone=${x.r>x.p*1.15?'bad':x.r<x.p*.85?'info':'ok'}>${(x.r-x.p>0?'+':'')+Math.round((x.r-x.p)/x.p*100)} %<//>`:'—'}</td></tr>`)}</tbody></table></div>`:html`<div className="muted small">Aucun temps de conception renseigné. Le simulateur de charge permet de fixer un temps prévu, le temps réel se saisit dans l'onglet Économie de chaque fiche.</div>`}</div>`:null}
 </div>`;
}

/* ============ MODULE 2 — REGISTRE ============ */
function Registre({S,params,openFiche,go,toast,api,ro}){
 const [q,setQ]=useState(lsGet('fp.reg.q',''));
 const [fl,setFl]=useState({domaine:'',etape:'',pub:'',public:'',alertes:false});
 const [sort,setSort]=useState({k:'code',d:1});
 useEffect(()=>lsSet('fp.reg.q',q),[q]);
 const rows=useMemo(()=>{
  const s=q.trim().toLowerCase();
  let r=S.data.foad.map(f=>({...f,_a:alertsFor(f,S.data.validations,params),_c:completeness(f)}));
  if(s)r=r.filter(f=>[f.code,f.titre,f.domaine,f.sousDomaine,f.description,f.objectifs,f.concepteur,f.expert,f.referentiel].join(' ').toLowerCase().includes(s));
  if(fl.domaine)r=r.filter(f=>f.domaine===fl.domaine);
  if(fl.etape)r=r.filter(f=>f.etape===fl.etape);
  if(fl.pub)r=r.filter(f=>(f.statutPublication||'Non publiée')===fl.pub);
  if(fl.public)r=r.filter(f=>(f.publics||[]).includes(fl.public));
  if(fl.alertes)r=r.filter(f=>f._a.length);
  const get=f=>sort.k==='_c'?f._c.pct:sort.k==='_a'?f._a.length:(f[sort.k]??'');
  r.sort((a,b)=>{const x=get(a),y=get(b);return (typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'fr'))*sort.d});
  return r;
 },[S.data.foad,S.data.validations,q,fl,sort,params]);
 const th=(k,l,c)=>html`<th className=${'sort '+(c||'')} onClick=${()=>setSort(s=>({k,d:s.k===k?-s.d:1}))} aria-sort=${sort.k===k?(sort.d>0?'ascending':'descending'):'none'}>${l}${sort.k===k?(sort.d>0?' ▲':' ▼'):''}</th>`;
 const exportCsv=async()=>{
  const keys=['code',...ALL_FIELDS.map(f=>f.k).filter(k=>k!=='code')];
  const esc=v=>{v=Array.isArray(v)?v.join(', '):v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[keys.map(k=>(ALL_FIELDS.find(f=>f.k===k)||{l:k}).l).join(';')].concat(rows.map(f=>keys.map(k=>esc(f[k])).join(';')));
  try{await api.download('registre-foad-'+today()+'.csv','﻿'+lines.join('\r\n'));toast('Export CSV proposé au téléchargement')}catch(e){if(e.code!=='declined')toast(e.message||'Téléchargement impossible')}
 };
 return html`<div>
  <${Head} eyebrow="Module 2" title="Registre central des FOAD" sub=${rows.length+' fiche(s) affichée(s) sur '+S.data.foad.length+'. Étape du cycle, statut de publication et autorisation de diffusion sont suivis séparément.'}>
   <button className="btn" onClick=${exportCsv} disabled=${!S.canDownload}><${Ico} n="dl"/> Export CSV</button>
   ${ro?null:html`<button className="btn p" onClick=${()=>go('fiche-new')}><${Ico} n="plus"/> Nouvelle fiche</button>`}
  <//>
  <div className="filters">
   <input id="reg-q" placeholder="Rechercher : intitulé, objectif, concepteur, référentiel…" value=${q} onChange=${e=>setQ(e.target.value)} aria-label="Recherche"/>
   <select id="reg-dom" value=${fl.domaine} onChange=${e=>setFl({...fl,domaine:e.target.value})} aria-label="Domaine"><option value="">Tous domaines</option>${params.domaines.map(d=>html`<option key=${d}>${d}</option>`)}</select>
   <select id="reg-et" value=${fl.etape} onChange=${e=>setFl({...fl,etape:e.target.value})} aria-label="Étape"><option value="">Toutes étapes</option>${ETAPES.map(d=>html`<option key=${d}>${d}</option>`)}</select>
   <select id="reg-pub" value=${fl.pub} onChange=${e=>setFl({...fl,pub:e.target.value})} aria-label="Publication"><option value="">Toute publication</option>${ST_PUBLICATION.map(d=>html`<option key=${d}>${d}</option>`)}</select>
   <select id="reg-publ" value=${fl.public} onChange=${e=>setFl({...fl,public:e.target.value})} aria-label="Public"><option value="">Tous publics</option>${PUBLICS.map(d=>html`<option key=${d}>${d}</option>`)}</select>
   <label className="row small"><input type="checkbox" id="reg-al" checked=${fl.alertes} onChange=${e=>setFl({...fl,alertes:e.target.checked})}/> Avec alertes</label>
  </div>
  ${rows.length?html`<div className="tbl-wrap"><table>
   <thead><tr>${th('code','Code')}${th('titre','Intitulé')}${th('domaine','Domaine')}${th('type','Type')}${th('etape','Étape')}${th('statutPublication','Publication')}<th>Diffusion</th>${th('dureeTheo','Durée','num')}${th('prochaineRevision','Révision')}${th('_c','Complétude')}${th('_a','Alertes','num')}</tr></thead>
   <tbody>${rows.map(f=>html`<tr key=${f.id} className="click" onClick=${()=>openFiche(f.id)}>

/* ============ FICHE FOAD ============ */
function blankFoad(list){return {code:nextCode(list),titre:'',etape:'À qualifier',statutConception:'Non démarrée',statutPublication:'Non publiée',version:'',valid:{},validVersion:{},conf:{},actions:[],enasis:{},histEtapes:[]}}
function Fiche({S,params,id,api,toast,close,ro,openFiche,tabsAllowed,initialTab}){
 const tabs=FICHE_TABS.filter(([k])=>!tabsAllowed||tabsAllowed.includes(k)||id==='new');
 const src=id==='new'?null:S.data.foad.find(f=>f.id===id);
 const [d,setD]=useState(()=>src?clone(src):blankFoad(S.data.foad));
 const [tab,setTab]=useState(()=>tabs.some(t=>t[0]===initialTab)?initialTab:(tabs[0]||['ident'])[0]);
 const [dirty,setDirty]=useState(false);
 const [confirmDel,setConfirmDel]=useState(false);
 const fid=id==='new'?null:id;
 useEffect(()=>{if(src&&!dirty)setD(clone(src))},[src&&src.updatedAt]);
 if(id!=='new'&&!src)return html`<div className="empty-state">Fiche introuvable. <button className="btn q" onClick=${close}>Retour au registre</button></div>`;
 const set=(k,v)=>{setD(x=>{const n={...x,[k]:v};if((k==='statutPublication'&&v==='Publiée')||(k==='datePublication'&&n.statutPublication==='Publiée')){if(isEmpty(x.prochaineRevision)||(x.conf||{}).prochaineRevision==='suppose'){const b=new Date((n.datePublication||today())+'T12:00:00');b.setMonth(b.getMonth()+(+params.revisionMois||12));n.prochaineRevision=b.toISOString().slice(0,10);n.conf={...(n.conf||{}),prochaineRevision:'suppose'}}}return n});setDirty(true)};
 const setConf=(k,v)=>{setD(x=>({...x,conf:{...(x.conf||{}),[k]:v}}));setDirty(true)};
 const c=completeness(d);const al=alertsFor(d,S.data.validations,params);
 const save=async()=>{
  if(!d.titre.trim()){toast('L\'intitulé est obligatoire pour enregistrer.');setTab('ident');return}
  const nid=fid||uid('F');
  const changed=src?ALL_FIELDS.filter(f=>JSON.stringify(src[f.k]??'')!==JSON.stringify(d[f.k]??'')).map(f=>f.l):['création'];
  const body={...d};
  if(src&&src.etape!==d.etape){body.histEtapes=(d.histEtapes||[]).concat([{de:src.etape,a:d.etape,at:nowIso(),by:S.me}])}
  try{await api.save('foad',nid,body);
   await api.log(nid,src?'modification':'création',src?('Champs modifiés : '+changed.join(', ')):'Création de la fiche « '+d.titre+' »');
   if(src&&src.etape!==d.etape)await api.log(nid,'étape',src.etape+' → '+d.etape);
   setDirty(false);toast('Fiche enregistrée');if(!fid)openFiche(nid,true);
  }catch(e){toast('Enregistrement refusé : '+(e.message||e.code))}
 };
 const dup=async()=>{const n=clone(d);n.code=nextCode(S.data.foad);n.titre=d.titre+' (copie)';n.valid={};n.validVersion={};n.statutPublication='Non publiée';n.etape='Idée';n.histEtapes=[];n.datePublication='';n.lienEnasis='';const nid=uid('F');
  try{await api.save('foad',nid,n);await api.log(nid,'création','Duplication de '+d.code);toast('Fiche dupliquée');openFiche(nid,true)}catch(e){toast('Duplication refusée : '+(e.message||e.code))}};
 const del=async()=>{try{await api.remove('foad',fid);await api.log(fid,'suppression','Suppression de la fiche '+d.code+' « '+d.titre+' »');toast('Fiche supprimée');close()}catch(e){toast('Suppression refusée : '+(e.message||e.code))}};
 const vals=S.data.validations.filter(v=>v.foad===fid).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
 const journal=S.data.journal.filter(j=>j.foad===fid).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
 const cout=!isEmpty(d.coutEstime)?d.coutEstime:(params.tauxHoraire&&(d.tempsReel||d.tempsPrevu))?Math.round((d.tempsReel||d.tempsPrevu)*params.tauxHoraire):null;
 return html`<div>
  <button className="backbtn" onClick=${close}>← Retour</button>
  <${Head} eyebrow=${d.code+(d.version?' · v'+d.version:'')} title=${d.titre||'Nouvelle fiche FOAD'}>
   ${ro?null:html`${fid?html`<button className="btn" onClick=${dup}>Dupliquer</button>`:null}
   <button className="btn p" onClick=${save} disabled=${!dirty&&!!fid}>${dirty||!fid?'Enregistrer':'Enregistré'}</button>`}
  <//>
  <div className="row" style=${{marginBottom:12}}>
   <${Badge} tone=${etapeTone(d.etape)}>Étape : ${d.etape}<//><${Badge}>Conception : ${d.statutConception||'—'}<//><${Badge} tone=${pubTone(d.statutPublication)}>Publication : ${d.statutPublication||'Non publiée'}<//>
   <${Badge} tone=${validTone((d.valid||{})['Autorisation de diffusion délivrée'])}>Diffusion : ${(d.valid||{})['Autorisation de diffusion délivrée']||'Non sollicité'}<//>
   <span className="compl small"><span className="prog"><i style=${{width:c.pct+'%',background:c.pct>=80?'var(--ok)':c.pct>=50?'var(--warn)':'var(--bad)'}}></i></span>Complétude ${c.pct} %</span>
  </div>
  ${al.length?html`<div className="list" style=${{marginBottom:12}}>${al.map((a,i)=>html`<div key=${i} className=${'alert '+a.l}><span className="small">${a.t}</span></div>`)}</div>`:null}
  <div className="tabs" role="tablist">${tabs.map(([k,l])=>html`<button key=${k} role="tab" aria-selected=${tab===k} className=${tab===k?'on':''} onClick=${()=>setTab(k)}>${l}</button>`)}</div>
  ${F[tab]?html`<div className="card"><${FieldGrid} defs=${F[tab]} obj=${d} set=${set} setConf=${setConf} params=${params} ro=${ro}/>
   ${tab==='projet'?html`<${Actions} d=${d} set=${set} ro=${ro}/>`:null}
   ${tab==='publication'?html`<${EnasisCheck} d=${d} set=${set} ro=${ro}/>`:null}
   ${tab==='economie'?html`<div className="note" style=${{marginTop:12}}>Coût affiché : ${cout!=null?cout.toLocaleString('fr-FR')+' €'+(isEmpty(d.coutEstime)?' (calculé : temps × taux horaire paramétré)':' (saisi)'):'non calculable : renseignez un coût ou un taux horaire dans Paramètres'}.
     ${d.estimation?html`<br/>Dernière estimation du simulateur (${fmtD(d.estimation.date)}) : ${fmtH(d.estimation.bas)} / <b>${fmtH(d.estimation.central)}</b> / ${fmtH(d.estimation.haut)}, complexité ${d.estimation.complexite}.`:null}</div>`:null}
   ${tab==='usage'?html`<div className="note" style=${{marginTop:12}}>Taux d'achèvement : ${d.inscrits&&!isEmpty(d.acheves)?Math.round(d.acheves/d.inscrits*100)+' %':'non calculable'} · Les données marquées « Estimées » sont exclues des bilans de résultats.</div>`:null}
   ${tab==='ident'&&fid&&!ro?html`<div className="row" style=${{marginTop:16}}>${confirmDel?html`<span className="small">Supprimer définitivement cette fiche ? L'historique du journal est conservé.</span><button className="btn sm danger" onClick=${del}>Confirmer la suppression</button><button className="btn sm" onClick=${()=>setConfirmDel(false)}>Annuler</button>`:html`<button className="btn sm danger" onClick=${()=>setConfirmDel(true)}>Supprimer la fiche</button>`}</div>`:null}
  </div>`:null}
  ${tab==='valid'?html`<${Validations} S=${S} d=${d} fid=${fid} api=${api} toast=${toast} ro=${ro} dirty=${dirty}/>`:null}
  ${tab==='histo'?html`<div className="grid g2"><div className="card"><h3>Changements d'étape</h3>${(d.histEtapes||[]).length?html`<div className="list">${d.histEtapes.slice().reverse().map((h,i)=>html`<div key=${i} className="small"><span className="mono">${fmtDT(h.at)}</span> · ${h.de} → <b>${h.a}</b></div>`)}</div>`:html`<div className="muted small">Aucun changement d'étape tracé.</div>`}</div>
   <div className="card"><h3>Journal de la fiche</h3><${JournalList} S=${S} api=${api} rows=${journal}/></div></div>`:null}
  ${dirty&&!ro?html`<div className="note" style=${{marginTop:12}}>Modifications non enregistrées.</div>`:null}
 </div>`;
}

/* ============ MODULE 9 — VALIDATION ============ */
function Validations({S,d,fid,api,toast,ro,dirty}){
 const blank={etapeValidation:CIRCUIT[0],date:today(),validateur:'',fonction:'',version:d.version||'',decision:'Accordé',reserves:'',justificatif:'',commentaire:''};
 const [v,setV]=useState(blank);
 const vals=S.data.validations.filter(x=>x.foad===fid).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
 const add=async()=>{
  if(!fid){toast('Enregistrez la fiche avant de tracer une validation.');return}
  if(dirty){toast('Enregistrez d\'abord les modifications en cours de la fiche.');return}
  if(!v.validateur.trim()||!v.version.trim()){toast('Validateur et version sont obligatoires : une validation porte sur une version précise.');return}
  const src=S.data.foad.find(f=>f.id===fid);
  try{await api.save('validations',uid('V'),{...v,foad:fid,at:nowIso(),by:S.me});
   await api.save('foad',fid,{...src,valid:{...(src.valid||{}),[v.etapeValidation]:v.decision},validVersion:{...(src.validVersion||{}),[v.etapeValidation]:v.version}});
   await api.log(fid,'validation',v.etapeValidation+' : '+v.decision+' (v'+v.version+', '+v.validateur+')');
   setV(blank);toast('Validation tracée');
  }catch(e){toast('Enregistrement refusé : '+(e.message||e.code))}
 };
 const sv=(k,x)=>setV(o=>({...o,[k]:x}));
 return html`<div className="split">
  <div className="card"><h2>Circuit de validation</h2><div className="circuit">
   ${CIRCUIT.map(c=>{const s=(d.valid||{})[c]||'Non sollicité';const ver=(d.validVersion||{})[c];const ct=CIRCUIT_TIPS[c];return html`<div key=${c} className="st"><span>${c}<${Tip} k=${ct} text=${GLOSS[ct]?null:ct}/></span><span className="mono small muted">${ver?'v'+ver:''}</span><${Badge} tone=${validTone(s)}>${s}<//></div>`})}
  </div>
  <h3 style=${{marginTop:18}}>Historique des décisions</h3>

  <p className="small muted">Les décisions sont ajoutées, jamais modifiées depuis l'interface. Une nouvelle décision sur la même étape remplace le statut courant sans effacer l'historique.</p></div>
  ${ro?null:html`<div className="card"><h2>Tracer une décision</h2><div className="form">
   <div className="field wide"><label className="small muted" htmlFor="v-et">Étape</label><select id="v-et" value=${v.etapeValidation} onChange=${e=>sv('etapeValidation',e.target.value)}>${CIRCUIT.map(c=>html`<option key=${c}>${c}</option>`)}</select></div>

   <div className="field"><label className="small muted" htmlFor="v-ver">Version concernée *</label><input id="v-ver" value=${v.version} onChange=${e=>sv('version',e.target.value)}/></div>
   <div className="field"><label className="small muted" htmlFor="v-date">Date</label><input id="v-date" type="date" value=${v.date} onChange=${e=>sv('date',e.target.value)}/></div>
   <div className="field"><label className="small muted" htmlFor="v-val">Validateur *</label><input id="v-val" value=${v.validateur} onChange=${e=>sv('validateur',e.target.value)}/></div>

   <div className="field wide"><label className="small muted" htmlFor="v-res">Réserves</label><textarea id="v-res" value=${v.reserves} onChange=${e=>sv('reserves',e.target.value)}></textarea></div>
   <div className="field wide"><label className="small muted" htmlFor="v-just">Document justificatif (référence)</label><input id="v-just" value=${v.justificatif} onChange=${e=>sv('justificatif',e.target.value)}/></div>

/* ============ MODULE 3 — KANBAN ============ */
function Kanban({S,params,api,toast,openFiche,ro}){

 const cols=ETAPES.filter(e=>!hide||!['Archivage','Abandonné'].includes(e));

const FORMATS={
 doc:['Document ou fiche réflexe','Rappel ponctuel d\'une procédure, sans apprentissage nouveau.','Production rapide, consultable en intervention ou en garde.','Aucune trace d\'apprentissage ni d\'évaluation.'],
 micro:['Microlearning','Une notion isolée, à diffuser largement et rapidement.','Format court (5 à 10 min), facile à actualiser.','Ne construit pas une compétence complexe.'],
 court:['FOAD courte','Connaissances déclaratives pour un public large.','Traçabilité ENASIS, évaluation simple.','Peu adaptée aux gestes et aux situations dynamiques.'],
 struct:['FOAD structurée','Plusieurs séquences, objectifs multiples, évaluation formalisée.','Homogénéise le niveau sur tout le département.','Charge de conception et de maintenance plus forte.'],
 parcours:['Parcours complet','Montée en compétence d\'une fonction, plusieurs modules liés.','Cohérence d\'ensemble, suivi par profil.','Long à produire, nécessite un pilotage et des validations multiples.'],
 cv:['Classe virtuelle','Besoin d\'échanges, de questions-réponses, de retours d\'expérience.','Interaction avec un formateur sans déplacement.','Dépend de la disponibilité des formateurs et des agents en même temps.'],
 pres:['Présentiel','Gestes, matériels, sécurité, mise en situation réelle.','Seul format permettant d\'évaluer une compétence opérationnelle.','Mobilise formateurs, plateaux techniques et disponibilités.'],
 hyb:['Formation hybride','Apports théoriques à distance, pratique en présentiel.','Réduit le temps présentiel, arrive avec des acquis homogènes.','Exige d\'articuler les deux temps et de vérifier le préalable.']};
function Assistant(){
 const [a,setA]=useState({pratique:'non',risque:'faible',complexite:'simple',volume:'large',echanges:'non',duree:'court',ressources:'oui'});
 const sc={doc:0,micro:0,court:0,struct:0,parcours:0,cv:0,pres:0,hyb:0};
 const w=(k,v)=>sc[k]+=v;
 if(a.pratique==='oui'){w('pres',4);w('hyb',4);w('court',-2);w('micro',-2);w('doc',-2)}
 if(a.pratique==='partiel'){w('hyb',3);w('struct',1)}
 if(a.risque==='eleve'){w('pres',3);w('hyb',2);w('doc',-3);w('micro',-2)}
 if(a.risque==='moyen'){w('hyb',1);w('struct',1)}
 if(a.complexite==='simple'){w('doc',2);w('micro',3);w('court',2)}
 if(a.complexite==='moyenne'){w('court',1);w('struct',3)}
 if(a.complexite==='forte'){w('struct',2);w('parcours',3);w('hyb',1)}
 if(a.volume==='large'){w('court',2);w('micro',1);w('struct',1);w('pres',-1)}
 if(a.volume==='restreint'){w('pres',1);w('cv',1)}
 if(a.echanges==='oui'){w('cv',4);w('hyb',1)}
 if(a.duree==='court'){w('micro',2);w('doc',1);w('court',1)}
 if(a.duree==='long'){w('parcours',2);w('struct',1)}
 if(a.ressources==='non'){w('doc',-1);w('parcours',-1)}
 const rank=Object.entries(sc).sort((x,y)=>y[1]-x[1]);
 const Q=(k,l,o)=>html`<div className="field"><label className="small muted" htmlFor=${'as-'+k}>${l}</label><select id=${'as-'+k} value=${a[k]} onChange=${e=>setA({...a,[k]:e.target.value})}>${o.map(([v,t])=>html`<option key=${v} value=${v}>${t}</option>`)}</select></div>`;
 return html`<div>
  <${Head} eyebrow="Module 5" title="Aide au choix du format" sub="Une orientation, pas une décision. La pertinence finale relève du cadrage pédagogique et de l'avis métier."/>
  <div className="split"><div className="card"><div className="form">
   ${Q('pratique','Besoin de pratique gestuelle ou matérielle',[['non','Non'],['partiel','Partiel'],['oui','Oui, indispensable']])}
   ${Q('risque','Niveau de risque opérationnel',[['faible','Faible'],['moyen','Moyen'],['eleve','Élevé']])}
   ${Q('complexite','Complexité du contenu',[['simple','Simple, une notion'],['moyenne','Plusieurs notions liées'],['forte','Forte, compétence globale']])}
   ${Q('volume','Nombre d\'apprenants',[['restreint','Restreint (< 50)'],['moyen','Moyen'],['large','Large (tout le département)']])}
   ${Q('echanges','Besoin d\'échanges avec un formateur',[['non','Non'],['oui','Oui']])}
   ${Q('duree','Temps apprenant disponible',[['court','Moins de 30 min'],['moyen','30 min à 2 h'],['long','Plus de 2 h']])}
   ${Q('ressources','Ressources de référence existantes',[['oui','Oui, validées'],['non','Non ou à produire']])}
  </div></div>
  <div className="card"><h2>Formats suggérés</h2><div className="list">${rank.slice(0,3).map(([k],i)=>{const f=FORMATS[k];return html`<div key=${k} className=${'alert '+(i===0?'info':'')}><div><b>${i+1}. ${f[0]}</b><div className="small">Pertinent si : ${f[1]}</div><div className="small">Avantage : ${f[2]}</div><div className="small">Limite : ${f[3]}</div></div></div>`})}</div>
   ${a.pratique==='oui'||a.risque==='eleve'?html`<div className="alert bad" style=${{marginTop:10}}><span className="small"><b>Garde-fou :</b> une FOAD ne remplace ni la mise en pratique ni l'évaluation d'une compétence opérationnelle. Elle peut au mieux la préparer.</span></div>`:null}
  </div></div></div>`;
}

function Simulateur({S,params,api,toast,selComps,setSelComps,ro}){

 useEffect(()=>lsSet('fp.sim2',inp),[inp]);

 const comps=S.data.composants.filter(c=>selComps.includes(c.id));
 const r=simulate(inp,params,comps);
 const s=(k,v)=>setInp(o=>({...o,[k]:v}));
 const T=k=>{const h=SIM_HELP[k];return html`<${Tip} k=${GLOSS[h]?h:null} text=${GLOSS[h]?null:h}/>`};
 const N=(k,l,help)=>html`<div className="field"><div className="flabel"><span><label htmlFor=${'sim-'+k}>${l}</label>${T(help||k)}</span></div><input id=${'sim-'+k} type="number" min="0" value=${inp[k]} onChange=${e=>s(k,e.target.value===''?0:+e.target.value)}/></div>`;

 const attach=async()=>{const f=S.data.foad.find(x=>x.id===target);if(!f)return;
  const est={date:today(),bas:Math.round(r.bas),central:Math.round(r.central),haut:Math.round(r.haut),complexite:inp.complexite,entrees:inp,composants:comps.map(c=>c.nom)};
  try{await api.save('foad',f.id,{...f,estimation:est,tempsPrevu:Math.round(r.central),conf:{...(f.conf||{}),tempsPrevu:'suppose'}});await api.log(f.id,'estimation','Simulateur : '+est.bas+' / '+est.central+' / '+est.haut+' h (temps prévu fixé à '+est.central+' h)');toast('Estimation rattachée à '+f.code)}catch(e){toast('Enregistrement refusé : '+(e.message||e.code))}};
 const fixes=FIXED_PHASES.reduce((t,k)=>t+(+C.fixes[k]||0),0);
 return html`<div>

  <div className="split"><div className="card"><h2>Ce que contiendra la FOAD</h2><div className="form">
   ${N('duree','Durée pour l\'agent (min)')}${N('sequences','Nombre de séquences')}
   <div className="field"><div className="flabel"><span><label htmlFor="sim-q">Ressources de départ</label>${T('qualite')}</span></div><select id="sim-q" value=${inp.qualite} onChange=${e=>s('qualite',e.target.value)}><option value="bonnes">Bonnes, déjà validées</option><option value="partielles">Partielles, à compléter</option><option value="absentes">Absentes, tout à écrire</option></select></div>
   <div className="field"><div className="flabel"><span><label htmlFor="sim-mod">Modèle existant</label>${T('modele')}</span></div><label className="row small" style=${{minHeight:36}}><input type="checkbox" id="sim-mod" checked=${!!inp.modele} onChange=${e=>s('modele',e.target.checked)}/> Partir d'un modèle Rise ou de la charte</label></div>

 if(tool)rows=rows.filter(c=>c.format===tool);
 if(q)rows=rows.filter(c=>[c.nom,c.description,c.famille,c.consignes].join(' ').toLowerCase().includes(q.toLowerCase()));

 if(dispo)rows=rows.filter(c=>(c.disponibilite||'Disponible')===dispo);

 const save=async()=>{if(!(ed.nom||'').trim()){toast('Le nom est obligatoire.');return}const id=ed.id||uid('C');try{await api.save('composants',id,ed);await api.log(null,'composant',(ed.id?'Modification':'Ajout')+' du composant « '+ed.nom+' »');setEd(null);toast('Composant enregistré')}catch(e){toast('Enregistrement refusé : '+(e.message||e.code))}};
 const del=async()=>{try{await api.remove('composants',ed.id);await api.log(null,'composant','Suppression du composant « '+ed.nom+' »');setEd(null)}catch(e){toast(e.message||e.code)}};
 if(ed)return html`<div><button className="backbtn" onClick=${()=>setEd(null)}>← Composants et ressources</button><${Head} eyebrow=${ed.format||'Composant'} title=${ed.nom||'Nouveau composant'}>${ro?null:html`${ed.id?html`<button className="btn danger" onClick=${del}>Supprimer</button>`:null}<button className="btn p" onClick=${save}>Enregistrer</button>`}<//>

 const dTone=d=>d==='À développer'?'info':d==='À vérifier sur ENASIS'?'warn':'ok';
 return html`<div>

  <div className="row" style=${{marginBottom:12}}><input id="cmp-q" className="grow" style=${{width:'auto',flex:1,minWidth:200}} placeholder="Rechercher : accordéon, glisser-déposer, badge…" value=${q} onChange=${e=>setQ(e.target.value)}/>
   <select id="cmp-f" style=${{width:'auto'}} value=${fam} onChange=${e=>setFam(e.target.value)} aria-label="Famille"><option value="">Toutes familles</option>${fams.map(f=>html`<option key=${f}>${f}</option>`)}</select>
   <select id="cmp-d" style=${{width:'auto'}} value=${dispo} onChange=${e=>setDispo(e.target.value)} aria-label="Disponibilité"><option value="">Toute disponibilité</option>${CMP_DISPO.map(f=>html`<option key=${f}>${f}</option>`)}</select></div>
  ${rows.length?html`<div className="tbl-wrap"><table><thead><tr><th></th><th>Élément</th><th>Outil</th><th>Famille</th><th>Complexité</th><th className="num">Création<${Tip} k="tempsCreation"/></th><th className="num">Réutilisation<${Tip} k="tempsReutil"/></th><th>Disponibilité</th></tr></thead><tbody>
   ${rows.map(c=>html`<tr key=${c.id} className="click" onClick=${()=>setEd(clone(c))}><td onClick=${e=>e.stopPropagation()}><input type="checkbox" aria-label=${'Sélectionner '+c.nom} checked=${selComps.includes(c.id)} onChange=${()=>setSelComps(selComps.includes(c.id)?selComps.filter(x=>x!==c.id):selComps.concat([c.id]))}/></td>
    <td style=${{minWidth:260}}><b>${c.nom}</b><div className="small muted">${c.description||''}</div></td><td className="small">${(CMP_TOOLS.find(t=>t[0]===c.format)||[0,c.format||'—'])[1]}</td><td className="small">${c.famille||'—'}</td><td className="small">${c.complexite||'—'}</td><td className="num">${fmtH(c.tempsCreation)}</td><td className="num">${fmtH(c.tempsReutil)}</td><td><${Badge} tone=${dTone(c.disponibilite||'Disponible')}>${c.disponibilite||'Disponible'}<//></td></tr>`)}</tbody></table></div>`
  :html`<div className="empty-state">${all.length?'Aucun élément ne correspond aux filtres.':'Le catalogue est vide. Importez le fichier de composants depuis Paramètres, ou créez un premier composant.'}</div>`}
 </div>`;
}

const REG_FIELDS=[{k:'titre',l:'Intitulé',t:'text',req:true,wide:true},{k:'categorie',l:'Rubrique',t:'select',opts:CAT_REGLE},{k:'nature',l:'Nature de l\'information',t:'select',opts:NATURE_REGLE,req:true},

function Gouvernance({S,params,api,toast,ro,openFiche}){
 const [tab,setTab]=useState('regles');const [ed,setEd]=useState(null);const [nat,setNat]=useState('');const [rev,setRev]=useState('');
 const regles=S.data.regles.filter(r=>r.kind!=='question'&&(!nat||r.nature===nat));
 const qs=S.data.regles.filter(r=>r.kind==='question');
 const save=async()=>{if(!(ed.titre||'').trim()){toast('L\'intitulé est obligatoire.');return}
  if(ed.kind!=='question'&&ed.nature==='Texte réglementaire vérifié'&&(isEmpty(ed.source)||isEmpty(ed.reference))){toast('Un texte réglementaire « vérifié » doit avoir une source et une référence.');return}
  if(ed.kind==='question'&&ed.statut==='Tranchée'&&isEmpty(ed.sourceDecision)){toast('Une question tranchée doit citer la source de la décision.');return}
  const id=ed.id||uid('R');try{await api.save('regles',id,ed);await api.log(null,'gouvernance',(ed.id?'Modification':'Ajout')+' : '+ed.titre+(ed.statut?' ('+ed.statut+')':''));setEd(null);toast('Enregistré')}catch(e){toast('Enregistrement refusé : '+(e.message||e.code))}};
 const hits=rev.trim()?S.data.foad.filter(f=>[f.referentiel,f.depReglementaires,f.depTechniques].join(' ').toLowerCase().includes(rev.trim().toLowerCase())):[];
 const flag=async()=>{try{for(const f of hits){await api.save('foad',f.id,{...f,revisionNecessaire:true,typeRevision:f.typeRevision||'Révision réglementaire'});await api.log(f.id,'révision','Révision identifiée suite à l\'évolution de « '+rev+' »')}toast(hits.length+' fiche(s) marquée(s) « révision nécessaire »')}catch(e){toast(e.message||e.code)}};
 if(ed){const defs=ed.kind==='question'?Q_FIELDS:REG_FIELDS;return html`<div><button className="backbtn" onClick=${()=>setEd(null)}>← Référentiel de gouvernance</button>

  <div className="card"><div className="form">${defs.map(f=>html`<${Field} key=${f.k} def=${{...f,noConf:true}} value=${ed[f.k]} params=${params} ro=${ro} onChange=${v=>setEd({...ed,[f.k]:v})}/>`)}</div></div></div>`}
 return html`<div>
  <${Head} eyebrow="Module 8" title="Référentiel de gouvernance" sub="Toute règle porte sa nature et sa source. Aucune disposition n'est considérée comme acquise sans source identifiable.">

  <//>
  <div className="tabs">${[['regles','Règles et références ('+S.data.regles.filter(r=>r.kind!=='question').length+')'],['questions','Questions à trancher ('+qs.filter(q=>q.statut!=='Tranchée').length+' ouvertes)'],['revision','Assistant de révision']].map(([k,l])=>html`<button key=${k} className=${tab===k?'on':''} onClick=${()=>setTab(k)}>${l}</button>`)}</div>
  ${tab==='regles'?html`<div><div className="chips" style=${{marginBottom:12}}><button className=${'chip'+(!nat?' on':'')} onClick=${()=>setNat('')}>Toutes</button>${NATURE_REGLE.map(n=>html`<button key=${n} className=${'chip'+(nat===n?' on':'')} onClick=${()=>setNat(n)}>${n}</button>`)}</div>
   ${regles.length?CAT_REGLE.concat(['']).map(cat=>{const rs=regles.filter(r=>(r.categorie||'')===cat);if(!rs.length)return null;return html`<div key=${cat} style=${{marginBottom:14}}><h3 style=${{fontFamily:'var(--f-display)',margin:'0 0 8px'}}>${cat||'Sans rubrique'}</h3><div className="tbl-wrap"><table><thead><tr><th>Intitulé</th><th>Nature</th><th>Source / référence</th><th>Vérification</th></tr></thead><tbody>
    ${rs.map(r=>html`<tr key=${r.id} className="click" onClick=${()=>setEd(clone(r))}><td><b>${r.titre}</b>${r.contenu?html`<div className="small muted">${r.contenu.slice(0,160)}${r.contenu.length>160?'…':''}</div>`:null}</td><td><${Badge} tone=${NAT_TONE[r.nature]}>${r.nature||'—'}<//></td><td>${r.source||html`<span style=${{color:'var(--bad)'}}>Source manquante</span>`}<div className="small muted">${r.reference||''}</div></td><td>${r.verif||'Non vérifié'}<div className="small muted">${fmtD(r.dateVerif)}</div></td></tr>`)}</tbody></table></div></div>`}):html`<div className="empty-state">Aucune règle pour ce filtre.</div>`}</div>`:null}

    ${hits.length&&!ro?html`<div><button className="btn p" onClick=${flag}>Marquer ${hits.length} fiche(s) « révision nécessaire »</button></div>`:null}</div>`:null}</div>`:null}
 </div>`;

/* ============ MODULE 13 — BILAN ============ */
function Bilan({S,params,api,toast}){
 const [per,setPer]=useState('annee');
 const y=new Date().getFullYear(),m=new Date().getMonth();
 const start=per==='mois'?new Date(y,m,1):per==='trimestre'?new Date(y,Math.floor(m/3)*3,1):per==='annee'?new Date(y,0,1):new Date(2000,0,1);
 const s0=start.toISOString().slice(0,10);
 const inP=d=>d&&d>=s0;
 const fo=S.data.foad;
 const pub=fo.filter(f=>f.statutPublication==='Publiée'&&inP(f.datePublication));
 const pubSans=fo.filter(f=>f.statutPublication==='Publiée'&&!f.datePublication).length;
 const moves=S.data.journal.filter(j=>j.type==='étape'&&inP((j.at||'').slice(0,10)));
 const pubsCnt=PUBLICS.map(p=>({k:p,v:pub.filter(f=>(f.publics||[]).includes(p)).length})).filter(r=>r.v);
 const tReel=fo.filter(f=>!isEmpty(f.tempsReel)),tPrev=fo.filter(f=>!isEmpty(f.tempsPrevu));
 const sumR=tReel.reduce((s,f)=>s+f.tempsReel,0),sumP=tPrev.reduce((s,f)=>s+f.tempsPrevu,0);
 const reel=fo.filter(f=>f.usageSource==='Réelles (export ENASIS)'&&!isEmpty(f.inscrits));
 const ins=reel.reduce((s,f)=>s+(+f.inscrits||0),0),ach=reel.reduce((s,f)=>s+(+f.acheves||0),0);
 const encours=fo.filter(f=>!TERMINAUX.includes(f.etape)&&!['À qualifier','Idée'].includes(f.etape));
 const dec=fo.filter(f=>!isEmpty(f.decisionAttendue)),qs=S.data.regles.filter(r=>r.kind==='question'&&r.statut!=='Tranchée');
 const al=fo.flatMap(f=>alertsFor(f,S.data.validations,params).filter(a=>a.l==='bad').map(a=>({...a,f})));
 const perLabel={mois:'mois en cours',trimestre:'trimestre en cours',annee:'année '+y,tout:'toute la période'}[per];
 const sections=[
  ['Qu\'avons-nous produit ?',[pub.length+' FOAD publiée(s) sur la période ('+perLabel+')'+(pub.length?' : '+pub.map(f=>f.titre).join(', '):'')+'.', moves.length+' changement(s) d\'étape tracé(s) sur la période.', pubSans?pubSans+' FOAD publiée(s) sans date de publication renseignée, non rattachable(s) à une période.':null]],
  ['Pour quels publics ?',[pubsCnt.length?pubsCnt.map(r=>r.k+' : '+r.v).join(' · '):'Publics non renseignés sur les FOAD publiées de la période.']],
  ['À quel coût et avec quels moyens ?',[tReel.length?'Temps de conception réellement mobilisé : '+fmtH(sumR)+' ('+tReel.length+' fiche(s) renseignée(s) sur '+fo.length+').':'Aucun temps de conception réel renseigné.', tPrev.length?'Temps prévu cumulé : '+fmtH(sumP)+' ('+tPrev.length+' fiche(s)).':null, params.tauxHoraire&&tReel.length?'Valorisation au taux paramétré ('+params.tauxHoraire+' €/h) : '+Math.round(sumR*params.tauxHoraire).toLocaleString('fr-FR')+' €.':'Valorisation financière non calculée : taux horaire non paramétré.']],
  ['Quels résultats avons-nous obtenus ?',[reel.length?ins+' inscrits et '+ach+' achèvements sur '+reel.length+' FOAD disposant de données réelles ENASIS (taux d\'achèvement '+(ins?Math.round(ach/ins*100):0)+' %).':'Aucune donnée d\'utilisation réelle importée. Les données estimées sont exclues.']],
  ['Que reste-t-il à faire ?',encours.length?encours.map(f=>f.titre+' — '+f.etape+(f.dateCible?', cible '+fmtD(f.dateCible):'')+(isEmpty(f.chargeRestante)?'':', reste '+fmtH(f.chargeRestante))):['Aucun projet en cours.']],
  ['Quels arbitrages sont nécessaires ?',(dec.map(f=>f.titre+' : '+f.decisionAttendue)).concat(qs.map(q=>'Gouvernance : '+q.titre+(q.autorite?' ('+q.autorite+')':''))).concat(dec.length||qs.length?[]:['Aucun arbitrage en attente.'])],
  ['Quels sont les risques à venir ?',al.length?al.map(a=>a.f.titre+' : '+a.t):['Aucune alerte bloquante sur les données renseignées.']]];
 const text='FOAD PILOT 85 — Bilan ('+perLabel+') — édité le '+fmtD(today())+'\n\n'+sections.map(([t,l])=>t.toUpperCase()+'\n'+l.filter(Boolean).map(x=>'- '+x).join('\n')).join('\n\n');
 const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);
 const dl=async()=>{const h='<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Bilan FOAD SDIS 85</title><style>body{font-family:Arial,sans-serif;max-width:800px;margin:30px auto;color:#18202f;line-height:1.45}h1{color:#12203a;border-bottom:3px solid #c0142f;padding-bottom:6px}h2{color:#12203a;font-size:16px;margin-top:22px}li{margin:3px 0}.m{color:#5b6578;font-size:12px}</style></head><body><h1>Bilan des FOAD — '+esc(perLabel)+'</h1><p class="m">SDIS de la Vendée · FOAD PILOT 85 · édité le '+fmtD(today())+'. Indicateurs calculés sur les seules données renseignées.</p>'+sections.map(([t,l])=>'<h2>'+esc(t)+'</h2><ul>'+l.filter(Boolean).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>').join('')+'</body></html>';
  try{await api.download('bilan-foad-'+per+'-'+today()+'.html',h);toast('Bilan proposé au téléchargement (à ouvrir puis imprimer depuis le navigateur)')}catch(e){if(e.code!=='declined')toast(e.message||'Téléchargement impossible')}};
 const copy=()=>{navigator.clipboard.writeText(text).then(()=>toast('Bilan copié'),()=>toast('Copie refusée par cette vue : sélectionnez le texte manuellement'))};
 return html`<div className="report">
  <${Head} eyebrow="Module 13" title="Bilan pour la hiérarchie" sub="Synthèse générée à partir du registre. Les données absentes sont signalées, jamais estimées.">
   <select id="bil-per" style=${{width:'auto'}} value=${per} onChange=${e=>setPer(e.target.value)} aria-label="Période"><option value="mois">Bilan mensuel</option><option value="trimestre">Bilan trimestriel</option><option value="annee">Bilan annuel</option><option value="tout">Depuis l'origine</option></select>
   <button className="btn" onClick=${copy}>Copier le texte</button><button className="btn p" onClick=${dl} disabled=${!S.canDownload}><${Ico} n="dl"/> Bilan imprimable</button>
  <//>
  <div className="card">${sections.map(([t,l])=>html`<div key=${t}><h2>${t}</h2><ul>${l.filter(Boolean).map((x,i)=>html`<li key=${i}>${x}</li>`)}</ul></div>`)}</div>
 </div>`;
}

     <div className="field"><label className="small muted" htmlFor="par-seuil">Seuil d'alerte des échéances (jours)</label><input id="par-seuil" type="number" value=${p.seuilAlerte} onChange=${e=>setP({...p,seuilAlerte:+e.target.value})}/></div></div></div>
